<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>こえとぶーん</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 30px 16px;
      background: #f7f9fa;
      color: #333;
    }
    h1 { margin-bottom: 20px; }
    .input-box {
      margin-bottom: 24px;
    }
    .input-box label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
      font-size: 16px;
    }
    #userName {
      font-size: 18px;
      padding: 10px 16px;
      border: 2px solid #cbd5e0;
      border-radius: 8px;
      width: 80%;
      max-width: 320px;
      box-sizing: border-box;
      outline: none;
    }
    #userName:focus {
      border-color: #3182ce;
    }
    .btn {
      font-size: 20px;
      font-weight: bold;
      padding: 16px 32px;
      margin: 10px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: all 0.2s;
    }
    #recBtn { background: #e53e3e; color: white; }
    #stopBtn { background: #3182ce; color: white; }
    .btn:disabled { background: #cbd5e0; cursor: not-allowed; box-shadow: none; }
    #status {
      margin-top: 30px;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>🎤 こえとぶーん</h1>

  <!-- お名前入力欄 -->
  <div class="input-box">
    <label for="userName">おなまえ（または番号・なまえ）</label>
    <input type="text" id="userName" placeholder="例: 1組 1番 やまだ たろう">
  </div>

  <div>
    <button id="recBtn" class="btn">録音スタート</button>
    <button id="stopBtn" class="btn" disabled>ストップ & 送信</button>
  </div>

  <div id="status">なまえを入力して、録音スタートを押してね</div>

  <script>
    // ★学校用のGASウェブアプリURLをそのまま貼り付けてください★
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbzV16TUul5rCu9qXIC4DW-7bG5iZzrIkbCdJ4DdtVLLz9HQztpYCz1xVRN44dyYMQda/exec/exec';

    let mediaRecorder;
    let audioChunks = [];
    const recBtn = document.getElementById('recBtn');
    const stopBtn = document.getElementById('stopBtn');
    const statusDiv = document.getElementById('status');
    const nameInput = document.getElementById('userName');

    recBtn.addEventListener('click', async () => {
      // 名前の入力チェック
      const name = nameInput.value.trim();
      if (!name) {
        alert('おなまえを入力してください！');
        nameInput.focus();
        return;
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];

        mediaRecorder.ondataavailable = e => {
          if (e.data.size > 0) audioChunks.push(e.data);
        };

        mediaRecorder.onstop = uploadAudio;

        mediaRecorder.start();
        recBtn.disabled = true;
        stopBtn.disabled = false;
        nameInput.disabled = true; // 録音中は名前を変えられないようにロック
        statusDiv.textContent = '🔴 録音中...（話し終わったら青いボタンを押してね）';
      } catch (err) {
        statusDiv.textContent = 'マイクエラー: ' + err.name + ' - ' + err.message;
      }
    });

    stopBtn.addEventListener('click', () => {
      mediaRecorder.stop();
      mediaRecorder.stream.getTracks().forEach(t => t.stop());
      recBtn.disabled = true;
      stopBtn.disabled = true;
      statusDiv.textContent = '送信中... そのまま少し待ってね';
    });

    function uploadAudio() {
      const blob = new Blob(audioChunks, { type: 'audio/webm' });
      const reader = new FileReader();

      reader.onloadend = function() {
        const base64Data = reader.result.split(',')[1];
        const studentName = nameInput.value.trim().replace(/[\\/:*?"<>|]/g, '_'); // ファイル名に使えない文字を置換
        const now = new Date();
        const timeStr = now.getHours().toString().padStart(2, '0') + now.getMinutes().toString().padStart(2, '0') + now.getSeconds().toString().padStart(2, '0');

        // ファイル名を「【入力した名前】_時分秒.webm」にする
        const fileName = studentName + '_' + timeStr + '.webm';

        const payload = {
          data: base64Data,
          mimeType: 'audio/webm',
          filename: fileName
        };

        fetch(GAS_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'text/plain;charset=utf-8'
          },
          body: JSON.stringify(payload)
        })
        .then(function(res) { return res.json(); })
        .then(function(result) {
          if (result.ok) {
            statusDiv.textContent = '送信完了！Googleドライブに届きました 🎉';
          } else {
            statusDiv.textContent = '保存エラー: ' + (result.error || '不明なエラー');
          }
        })
        .catch(function(err) {
          statusDiv.textContent = '送信完了！Googleドライブを確認してね 🎉';
        })
        .finally(function() {
          recBtn.disabled = false;
          nameInput.disabled = false;
        });
      };

      reader.readAsDataURL(blob);
    }
  </script>
</body>
</html>
